url: https://strategicprojects.github.io/vrpr/

template:
  bootstrap: 5
  bslib:
    primary: "#16323d"

reference:
- title: Modelling
  desc: Build a VRP model by piping together depots, clients and vehicle types.
  contents:
  - vrp_model
  - add_depot
  - add_clients
  - add_vehicle_type
  - add_shipments
  - add_client_group

- title: Solving
  desc: Run the iterated local search solver and control when it stops.
  contents:
  - vrp_solve
  - ils_params
  - vrpr_stop

- title: Results
  desc: Inspect and visualise a solution.
  contents:
  - cost
  - routes
  - summary.vrpr_result
  - unvisited_clients
  - unplanned
  - plot.vrpr_result
  - plot.vrpr_model

- title: Reading instances
  desc: Read standard VRPLIB and Solomon instance files.
  contents:
  - read_vrplib
  - read_solomon

- title: Lower-level building blocks
  desc: Direct access to the problem data, solutions and cost evaluator.
  contents:
  - vrp_problem_data
  - vrp_solution
  - vrp_random_solution
  - vrp_cost_evaluator
  - solution_cost

footer:
  structure:
    left: [developed_by, lineage]
    right: built_with
  components:
    lineage: >
      Built on [PyVRP](https://pyvrp.org) by Niels Wouda, Leon Lan, Wouter
      Kool and the PyVRP contributors
      ([cite it](https://doi.org/10.1287/ijoc.2023.0055)): its C++ core is
      bundled and its search loop ported to R. Not affiliated with or
      endorsed by the PyVRP project.
